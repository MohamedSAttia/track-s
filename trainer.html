  const metricNumber = (value, max = 1000000000) => { const n = typeof value === 'number' || (typeof value === 'string' && value.trim() !== '') ? Number(value) : NaN; return Number.isFinite(n) && n >= 0 && n <= max ? n : null; };

      if (activeDrawer(context)) $('#dBlockMsg').textContent = valid ? (targetBlocked ? 'أكّد الخادم حظر الحساب وإلغاء جلساته؛ تقدّمه ونتائجه محفوظة.' : 'أكّد الخادم رفع الحظر. على المتدرب تسجيل الدخول من جديد.') : 'لم يُؤكَّد تنفيذ الطلب. قد تكون الحالة تغيّرت؛ انتظر تحديث الخادم قبل المحاولة مجددًا.';
      render();
    } finally {
      if (serverAction === operation) { serverAction = null; syncBlockControls(); if (operation.epoch === sessionEpoch && DATA) refresh(); }
    }
  }
  function drawer(u) {
    if (!u || !liveAccount(u.id)) return; u = liveAccount(u.id); const context = { id: u.id, epoch: sessionEpoch }; drawerContext = context; const d = $('#drawer'); const p = u.progress || {}; const it = p.items || {};
    d.innerHTML = `<div class="tools"><h3 style="margin:0">${esc(u.name)}</h3><span style="flex:1"></span><button class="btn ghost sm" id="dClose">إغلاق</button></div>
      <p class="note"><span id="dPresence">${dot(u)}${online(u) ? '<b style="color:#16a34a">متصل الآن</b> · ' : ''}</span>${esc(u.group || 'عام')} · ${esc(u.org || p.org || '')} · <span dir="ltr">${esc(u.phone || '')}</span> · ${esc(u.email || '')}<br>سُجّل ${u.created ? new Date(u.created).toLocaleString('ar-SA') : '—'} · آخر ظهور <span id="dSeen">${seen(u) ? ago(seen(u)) : '—'}</span></p>
      <div class="card" id="dBlockArea"><b id="dBlockStatus"></b><p class="note">الحظر يوقف تسجيل الدخول والمزامنة ويلغي الجلسات، ويحفظ الملف والتقدّم والنتائج. رفعه يتطلب تسجيل الدخول من جديد؛ صفحات المحتوى العامة ليست خاصة.</p><span class="note" id="dBlockMsg" role="status"></span></div>
      ${DATA.local ? '' : `<details style="margin:8px 0;border:1px solid var(--line);border-radius:10px;padding:8px 12px"><summary style="cursor:pointer;font-weight:700;color:var(--navy)">✏️ تعديل البيانات والمجموعة</summary>
        <div class="tools" style="margin-top:10px">
          <label>الاسم<input id="eName" value="${esc(u.name || '')}"></label>
          <label>المجموعة<select id="eGroup">${grpOptions(u.group)}</select></label>
          <label>الجهة<input id="eOrg" value="${esc(u.org || '')}"></label>
          <label>الجوال (هوية تسجيل الدخول، لا يُعدّل هنا)<input id="ePhone" readonly dir="ltr" value="${esc(u.phone || '')}"></label>
          <label>المسمّى<input id="eRole" value="${esc(u.role || '')}"></label>
          <button class="btn gold sm" id="eSave">💾 حفظ التعديلات</button><span class="note" id="eMsg"></span>
        </div></details>
      <details style="margin:8px 0;border:1px solid var(--line);border-radius:10px;padding:8px 12px"><summary style="cursor:pointer;font-weight:700;color:var(--navy)">🔔 إرسال إشعار لهذا المتدرب</summary>
        <div class="tools" style="margin-top:10px"><input id="nTitle" placeholder="عنوان الإشعار" style="min-width:160px"><input id="nBody" placeholder="نص الإشعار" style="min-width:260px"><button class="btn sm" id="nSend">إرسال</button><span class="note" id="nMsg"></span></div></details>`}
      <div class="kpis" style="margin-bottom:12px"><div class="kpi"><b>🏆 ${snapshotValue(pts(u))}</b><span>النقاط</span></div><div class="kpi"><b>⏱ ${tsec(u) === null ? '—' : esc(fmtTime(tsec(u)))}</b><span>وقت التعلّم</span></div><div class="kpi"><b>${snapshotValue(pct(u), '%')}</b><span>التقدّم</span></div><div class="kpi"><b>${snapshotValue(scoreOf(u, 'examBest'), '%')}</b><span>أفضل اختبار</span></div><div class="kpi"><b>${snapshotValue(scoreOf(u, 'quiz'), '%')}</b><span>أسئلة المحاضرات</span></div><div class="kpi"><b>${snapshotValue(scoreOf(u, 'maturity', 5))}</b><span>نضج مؤسسته /5</span></div></div>
      <div class="card" id="dParticipation"><b>تفصيل النقاط</b><p>${participationBreakdown(u,true)}</p></div>
      ${DAYS.map(day => `<h4 style="margin:12px 0 6px;color:var(--navy)">اليوم ${day.n} — ${esc(day.ar)} <small class="note">${snapshotValue(metricNumber((p.days || {})[day.n], 100), '%')}</small></h4><ul class="chk">${day.items.map(i => `<li class="${it[i.k] ? 'ok' : ''}">${it[i.k] ? '✅' : '⬜'} ${esc(i.t)}</li>`).join('')}</ul>`).join('')}
      <h4 style="margin:12px 0 6px;color:var(--navy)">ساحة الذكاء</h4><p class="note">${Object.entries(((p.scores || {}).arena) || {}).map(([k, v]) => `${esc(k)}: ${snapshotValue(metricNumber(v, 100), '%')}`).join(' · ') || '—'}</p>
      <h4 style="margin:12px 0 6px;color:var(--navy)">المصمّمات والنماذج المبنية</h4><p class="note">${(() => { const B = { objective: 'الأهداف والمؤشرات', total: 'الأداء الشامل', loa: 'خطوط المساءلة', iacm: 'نموذج IACM' }; const b = p.builders || []; return b.length ? b.map(k => '✅ ' + esc(B[k] || k)).join(' · ') : 'لم تُبنَ نماذج بعد'; })()}</p>
      ${DATA.local ? '' : `<button class="btn ghost sm" id="dDel" style="color:var(--bad)">حذف حساب الخادم نهائيًا</button><span class="note" id="dDelMsg" role="status"></span>`}`;
    d.classList.add('on'); $('#dClose').onclick = () => { if (drawerContext === context) drawerContext = null; d.classList.remove('on'); }; syncBlockControls();
    const del = $('#dDel'); if (del) del.onclick = async () => {
      if (!activeDrawer(context) || serverAction || !liveAccount(context.id)) return;
      if (!confirm('حذف حساب «' + u.name + '» (' + (u.phone || u.id) + ') نهائيًا من الخادم مع بياناته وتقدّمه؟ لا يمكن التراجع عن هذا الحذف. للحفاظ على النتائج استخدم الحظر بدلًا منه.')) return;
      const operation = { epoch: sessionEpoch, id: context.id }; serverAction = operation; rosterVersion++; syncBlockControls(); $('#dDelMsg').textContent = 'جارٍ الحذف…';
      try { const r = await boundedTrainerPost({ del: context.id }); if (operation.epoch !== sessionEpoch || !DATA) return;
        if (r.status === 401 || r.status === 403) { endTrainerSession('انتهت صلاحية دخول المدرب. سجّل الدخول مجددًا للتحقّق من حالة الحساب.'); return; }
        if (r.ok && r.j && r.j.ok === true && r.j.deleted === context.id) { if (activeDrawer(context)) { drawerContext = null; d.classList.remove('on'); } }
        else if (activeDrawer(context)) $('#dDelMsg').textContent = 'لم يُؤكَّد الحذف. تحقّق من تحديث الخادم قبل المحاولة مجددًا.';
      } finally { if (serverAction === operation) { serverAction = null; syncBlockControls(); if (operation.epoch === sessionEpoch && DATA) refresh(); } }
    };
    const eSave = $('#eSave'); if (eSave) eSave.onclick = async () => {
      const edit = { id: u.id, name: $('#eName').value, group: $('#eGroup').value, org: $('#eOrg').value, role: $('#eRole').value };
      $('#eMsg').textContent = 'جارٍ الحفظ…'; const r = await api({ method: 'POST', body: JSON.stringify({ edit }) });
      if (r.ok && r.j.ok) { $('#eMsg').textContent = '✅ حُفظت'; Object.assign(u, edit); refresh(); }
      else if (r.status === 404 || (r.j && r.j.error === 'not_found')) { $('#eMsg').innerHTML = 'هذا المتدرب غير موجود على الخادم الحيّ (بيانات قديمة في المتصفح). اطلب منه التسجيل من بوابة المتدربين، أو امسح البيانات القديمة من الصفحة الرئيسية.'; }
      else { $('#eMsg').textContent = 'تعذّر الحفظ — تحقّق من الاتصال وحاول مجددًا.'; }
    };
    const nSend = $('#nSend'); if (nSend) nSend.onclick = async () => {
      const title = $('#nTitle').value.trim(), bdy = $('#nBody').value.trim(); if (!title && !bdy) { $('#nMsg').textContent = 'اكتب نصًا.'; return; }
      $('#nMsg').textContent = 'جارٍ الإرسال…'; const r = await api({ method: 'POST', body: JSON.stringify({ notify: { to: 'user:' + u.id, title, body: bdy } }) });
      $('#nMsg').textContent = r.ok && r.j.ok ? '✅ أُرسل للمتدرب' : 'تعذّر الإرسال (فعّل قاعدة البيانات).'; if (r.ok && r.j.ok) { $('#nTitle').value = ''; $('#nBody').value = ''; }
    };
  }
  async function refresh() {
    if (!DATA || refreshing || serverAction) return false;
    const request = { epoch: sessionEpoch, version: rosterVersion }, controller = new AbortController(); refreshing = request;
    const timeout = setTimeout(() => controller.abort(), 10000);
    try {
      const r = await api({ signal: controller.signal, cache: 'no-store' }); if (request.epoch !== sessionEpoch || !DATA || request.version !== rosterVersion) return false;
      if (r.status === 401 || r.status === 403) { endTrainerSession('انتهت صلاحية دخول المدرب. سجّل الدخول مجددًا؛ الأرشيف المحلي ما زال متاحًا.'); return false; }
      if (r.ok && r.j.ok === true && Array.isArray(r.j.users) && r.j.local !== true) { DATA = r.j; DATA.users = mergeLocal(DATA.users); for (const id of uncertainAccounts) if (blockState(liveAccount(id))) uncertainAccounts.delete(id); lastRefresh = Date.now(); refreshError = ''; }
      else { refreshError = 'تعذّر تحديث الخادم؛ البيانات المعروضة قديمة. آخر تحديث ناجح: ' + (lastRefresh ? new Date(lastRefresh).toLocaleString('ar-SA') : 'غير متوفر'); }
      render(); return !refreshError;
    } finally { clearTimeout(timeout); if (refreshing === request) { refreshing = null; if (request.epoch === sessionEpoch && request.version !== rosterVersion && !serverAction && DATA) refresh(); } }
  }
  function endTrainerSession(message = '') { sessionEpoch++; rosterVersion++; serverAction = null; drawerContext = null; uncertainAccounts.clear(); showPrevious = false; showHiddenPrevious = false; if (closePreviousDialog) closePreviousDialog(); clearInterval(pollTimer); pollTimer = null; refreshing = null; DATA = null; sessionStorage.removeItem('tf_trainer_pin'); PIN = ''; $('#drawer').innerHTML = ''; $('#drawer').classList.remove('on'); $('#logout').hidden = true; login(); if ($('#msg')) $('#msg').textContent = message; }
  function start() {
    $('#logout').hidden = false;
    $('#logout').onclick = () => endTrainerSession();
    clearInterval(pollTimer); pollTimer = setInterval(() => { if (!document.hidden && document.visibilityState === 'visible') return refresh(); }, 15000);
  }
  document.addEventListener('visibilitychange', () => { if (DATA && !document.hidden && document.visibilityState === 'visible') refresh(); });
  window.addEventListener('storage', event => { if (DATA && (event.key === ARCHIVE_KEY || event.key === PREVIOUS_OVERLAY_KEY)) render(); });

  (async () => { if (PIN) { const r = await api(); if (r.ok && r.j.ok === true && Array.isArray(r.j.users) && r.j.local !== true) { DATA = r.j; lastRefresh = Date.now(); refreshError = ''; DATA.users = mergeLocal(DATA.users || []); render(); start(); } else login(); } else login(); })();
})();
</script>
