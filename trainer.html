table{width:100%;border-collapse:collapse;font-size:13px}th{background:var(--navy);color:#fff;padding:8px;text-align:right;position:sticky;top:0}td{border-bottom:1px solid var(--line);padding:7px 8px;vertical-align:middle}tr:hover td{background:#FBF8F2}

@media print{header .sp,.tools,.btn{display:none}}
</style>

<body>
<header><div class="in"><div><div class="k">TRACK FORD · TRAINER CONSOLE</div><h1>لوحة المدرب — متابعة المتدربين والمجموعات</h1></div>
<div class="sp"><a href="index.html">البوابة</a><a href="academy.html?all=1">الأكاديمية (كل الأيام)</a><a href="system.html">النظام</a><a href="navigator.html">المقيّم</a><button class="btn ghost sm" id="logout" hidden>خروج</button></div></div></header>

<script>
(() => {
  const $ = s => document.querySelector(s); const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    return '<div class="card" style="background:#FFF7ED;border:1px solid #FED7AA"><div class="tools"><b>أرشيف الأكواد المستوردة</b><span class="note">ملخصات تقدّم محفوظة في هذا المتصفح، مستقلة عن سجل الخادم الحيّ. هذا العرض لا يحذفها ولا ينشئ لها حسابات على الخادم.</span></div><button type="button" class="btn ghost sm" id="archiveOpen">عرض أرشيف الأكواد المستوردة</button></div>';
  }
  function archiveState() {

    if (raw === null) return { raw: null, error: 'لا توجد أكواد مستوردة في هذا المتصفح. استخدم الجهاز وملف المتصفح ورابط الموقع الذي استوردت فيه الأكواد.' };

  function showArchive() {

    overlay.innerHTML = '<section role="dialog" aria-modal="true" aria-labelledby="archiveTitle" class="card" style="width:min(1180px,100%);max-height:90vh;overflow:auto;margin:0"><div class="tools"><h2 id="archiveTitle" style="margin:0">أرشيف الأكواد المستوردة</h2><span style="flex:1"></span><button type="button" class="btn ghost sm" id="archiveClose">إغلاق</button></div><p class="note">هذه نسخ تقدّم وقت استيراد الأكواد، محفوظة على هذا الجهاز فقط. قد تكون قديمة أو مكررة؛ ليست قائمة حسابات الخادم ولا تدل على اتصال المتدرب الآن. العرض والتنزيل لا يرسلان شيئًا إلى الخادم ولا يغيّران الأرشيف.</p><div class="tools"><button type="button" class="btn gold sm" id="archiveExport">تنزيل نسخة JSON أصلية</button><span class="note">النسخة تتضمن بيانات المتدربين؛ احتفظ بها بشكل خاص.</span></div><p class="note" id="archiveStatus" role="status"></p><div style="overflow:auto"><table id="archiveTable"><thead><tr><th>#</th><th>الاسم</th><th>المجموعة</th><th>الجهة</th><th>الجوال</th><th>البريد</th><th>التقدّم</th><th>النقاط</th><th>الوقت (دقيقة)</th><th>الأيام 1–5</th><th>أفضل اختبار</th><th>تاريخ التسجيل في الكود</th></tr></thead><tbody id="archiveRows"></tbody></table></div></section>';
    document.body.appendChild(overlay); document.body.style.overflow = 'hidden';
    const close = () => { document.removeEventListener('keydown', keydown); overlay.remove(); document.body.style.overflow = previousOverflow; if (previousFocus && previousFocus.isConnected) previousFocus.focus(); };

    exportButton.onclick = () => {
      if (state.raw === null) return;

      catch (e) { status.textContent = 'تعذّر بدء التنزيل. الأرشيف الأصلي ما زال محفوظًا ولم يتغيّر.'; }
      finally { if (link) link.remove(); if (url) setTimeout(() => URL.revokeObjectURL(url), 1000); }
    };
    const text = (value, limit = 200) => typeof value === 'string' || typeof value === 'number' ? String(value).slice(0, limit) : '';
    const number = (value, max) => { const n = typeof value === 'number' || (typeof value === 'string' && value.trim() !== '') ? Number(value) : NaN; return Number.isFinite(n) && n >= 0 && n <= max ? n : null; };
    const numeric = (value, max = 1000000000, suffix = '', divisor = 1) => { const n = number(value, max); return n === null ? '—' : String(divisor === 1 ? n : Math.round(n / divisor)) + suffix; };
    for (const [index, row] of (state.rows || []).entries()) {
      const p = row.progress && typeof row.progress === 'object' && !Array.isArray(row.progress) ? row.progress : {}, scores = p.scores && typeof p.scores === 'object' ? p.scores : {}, days = p.days && typeof p.days === 'object' ? p.days : {};
      const created = typeof row.created === 'number' || typeof row.created === 'string' ? new Date(row.created) : null;
      const values = [index + 1, text(row.name) || 'بدون اسم', text(row.group), text(row.org), text(row.phone, 80), text(row.email, 254), numeric(p.overall, 100, '%'), numeric(p.points), numeric(p.timeSec, 1000000000, '', 60), [1, 2, 3, 4, 5].map(day => numeric(days[day], 100, '%')).join(' / '), numeric(scores.examBest, 100, '%'), created && Number.isFinite(created.getTime()) ? created.toLocaleString('ar-SA') : '—'];
      const tr = document.createElement('tr'); for (const value of values) { const td = document.createElement('td'); td.textContent = String(value); tr.appendChild(td); } $('#archiveRows').appendChild(tr);
    }
    $('#archiveTable').hidden = !state.rows || !state.rows.length; $('#archiveClose').focus();
  }
  function bindArchive() { const button = $('#archiveOpen'); if (button) button.onclick = showArchive; }
  function login() {
    $('#main').innerHTML = `${archiveEntry()}<div class="card login"><div style="font-size:44px">🔐</div><h2>دخول المدرب</h2><p class="note">أدخل الرقم السري للمدرب.</p><input id="pin" type="password" inputmode="numeric" placeholder="••••"><div style="margin-top:12px"><button class="btn gold" id="go">دخول</button></div><div class="note" id="msg" style="margin-top:8px"></div></div>`;
    $('#go').onclick = async () => {
      PIN = $('#pin').value.trim(); if (!PIN) { $('#msg').textContent = 'أدخل الرقم السري.'; return; }
      $('#msg').textContent = 'جارٍ التحقق…'; $('#go').disabled = true;
      let r = await api(); $('#go').disabled = false;
      if (!r.ok && (r.status === 0 || r.status === 404 || r.status >= 500)) {
        $('#msg').textContent = 'تعذّر الاتصال بخادم المتدربين. الدخول يحتاج خادمًا متاحًا؛ يمكنك عرض أرشيف الأكواد المحفوظة محليًا.'; return;
      }
      if (!r.ok || r.j.ok !== true || !Array.isArray(r.j.users) || r.j.local === true) { $('#msg').textContent = r.status === 401 ? 'الرقم السري غير صحيح.' : 'تعذّر الاتصال بالخادم — حاول مرة أخرى.'; return; }
      sessionStorage.setItem('tf_trainer_pin', PIN); localStorage.setItem('tf_unlock', '1'); DATA = r.j; lastRefresh = Date.now(); refreshError = ''; DATA.users = mergeLocal(DATA.users || []); render(); start(); };
    $('#pin').onkeydown = e => { if (e.key === 'Enter') $('#go').click(); };
    bindArchive();
  }
  const pct = u => (u.progress && u.progress.overall) || 0, cls = p => p >= 70 ? 'g' : p >= 35 ? 'w' : p > 0 ? 'b' : 'z';
  const pts = u => (u.progress && u.progress.points) || 0;
  const tsec = u => (u.progress && u.progress.timeSec) || 0;
  const fmtTime = s => { s = Math.round(s || 0); if (s < 60) return s + ' ث'; const m = Math.round(s / 60); if (m < 60) return m + ' د'; const h = Math.floor(m / 60); return h + ' س ' + (m % 60) + ' د'; };
  const sumBy = (arr, f) => arr.reduce((a, u) => a + (+f(u) || 0), 0);
  const seen = u => { const t = Math.max(u.lastSeen || 0, u.progress ? u.progress.at : 0, u.lastLogin || 0); return t ? new Date(t) : null; };
  const online = u => { const t = Math.max(u.lastSeen || 0, u.progress ? u.progress.at : 0); return t && (Date.now() - t < 150000); };
  const ago = d => { if (!d) return '—'; const m = Math.round((Date.now() - d) / 60000); return m < 2 ? 'الآن' : m < 60 ? `قبل ${m} د` : m < 1440 ? `قبل ${Math.round(m / 60)} س` : d.toLocaleDateString('ar-SA'); };
  const dot = u => online(u) ? '<span title="متصل الآن" style="display:inline-block;width:9px;height:9px;border-radius:50%;background:#22C55E;margin-inline-end:5px;box-shadow:0 0 0 3px rgba(34,197,94,.2)"></span>' : '<span title="غير متصل" style="display:inline-block;width:9px;height:9px;border-radius:50%;background:#CBD5E1;margin-inline-end:5px"></span>';
  const liveGroupExists = group => !!(DATA && (DATA.users || []).some(user => (user.group || 'عام') === group));
  function retainDrafts() {
    const values = {};
    for (const id of ['nTo', 'bTitle', 'bBody', 'rgFrom', 'rgTo', 'cStart', 'cGroups']) { const el = $('#' + id); if (el && (!['cStart', 'cGroups'].includes(id) || el.value !== el.defaultValue)) values[id] = el.value; }
    const active = document.activeElement, focus = active && active.id ? { id: active.id, start: active.selectionStart, end: active.selectionEnd, direction: active.selectionDirection } : null;
    return { values, focus };
  }
  function restoreDrafts(saved) {

    if (saved.focus) { const el = $('#' + saved.focus.id); if (el) { el.focus({ preventScroll: true }); if (typeof saved.focus.start === 'number') { try { el.setSelectionRange(saved.focus.start, saved.focus.end, saved.focus.direction || 'none'); } catch (e) {} } } }
  }
  // Imported codes are read-only snapshots, never authenticated accounts or notification targets.
  const snapshotText = (value, max = 200) => typeof value === 'string' || typeof value === 'number' ? String(value).slice(0, max) : '';
  const snapshotNumber = (value, max = 1000000000) => { const n = typeof value === 'number' || (typeof value === 'string' && value.trim() !== '') ? Number(value) : NaN; return Number.isFinite(n) && n >= 0 && n <= max ? n : null; };
  const snapshotValue = (value, suffix = '') => value === null || value === undefined ? '—' : String(value) + suffix;
  function importedRoster(liveUsers) {
    const state = archiveState(), serverIds = new Set(liveUsers.map(u => u.id).filter(id => typeof id === 'string' && /^[a-f0-9]{16}$/.test(id)));
    let matched = 0;

    for (const [index, row] of (state.rows || []).entries()) {

      const p = row.progress && typeof row.progress === 'object' && !Array.isArray(row.progress) ? row.progress : {}, days = p.days && typeof p.days === 'object' ? p.days : {}, scores = p.scores && typeof p.scores === 'object' ? p.scores : {};
      const at = snapshotNumber(p.at, Date.now() + 60000);
      rows.push({ __tfSource: 'imported', archiveIndex: index, id: snapshotText(row.id, 160), name: snapshotText(row.name) || 'بدون اسم', group: snapshotText(row.group, 80) || 'عام', org: snapshotText(row.org), phone: snapshotText(row.phone, 80), email: snapshotText(row.email, 254),
        progress: { overall: snapshotNumber(p.overall, 100), points: snapshotNumber(p.points), timeSec: snapshotNumber(p.timeSec), at: at && at > 0 ? at : null, days: Object.fromEntries([1, 2, 3, 4, 5].map(day => [day, snapshotNumber(days[day], 100)])), scores: { examBest: snapshotNumber(scores.examBest, 100), maturity: snapshotNumber(scores.maturity, 5) } } });
    }

  }
  function importedRow(u, index) {

    return `<tr data-source="imported" data-archive-row="${u.archiveIndex}" style="background:#FFF7ED"><td>${index + 1}</td><td><b>${esc(u.name)}</b><br><small class="note">نسخة مستوردة غير موثّقة · ليست تحديثًا حيًا</small></td><td>${esc(u.group)}</td><td>${esc(u.org)}</td><td>${snapshotValue(p.points)}</td><td>${p.timeSec === null ? '—' : esc(fmtTime(p.timeSec))}</td><td>${snapshotValue(p.overall, '%')}</td><td>${[1, 2, 3, 4, 5].map(day => snapshotValue(p.days[day], '%')).join(' / ')}</td><td>${snapshotValue(p.scores.examBest, '%')}</td><td>${snapshotValue(p.scores.maturity, '/5')}</td><td><small>وقت الملخص: ${esc(when)}</small></td><td><span class="note">قراءة فقط</span></td></tr>`;
  }
  function render() {

    };

      const title = $('#nTitle').value.trim(), bdy = $('#nBody').value.trim(); if (!title && !bdy) { $('#nMsg').textContent = 'اكتب نصًا.'; return; }
      $('#nMsg').textContent = 'جارٍ الإرسال…'; const r = await api({ method: 'POST', body: JSON.stringify({ notify: { to: 'user:' + u.id, title, body: bdy } }) });
      $('#nMsg').textContent = r.ok && r.j.ok ? '✅ أُرسل للمتدرب' : 'تعذّر الإرسال (فعّل قاعدة البيانات).'; if (r.ok && r.j.ok) { $('#nTitle').value = ''; $('#nBody').value = ''; }
    };
  }
  async function refresh() {
    if (!DATA || refreshing) return false;
    const request = { epoch: sessionEpoch }, controller = new AbortController(); refreshing = request;
    const timeout = setTimeout(() => controller.abort(), 10000);
    try {
      const r = await api({ signal: controller.signal }); if (request.epoch !== sessionEpoch || !DATA) return false;
      if (r.status === 401 || r.status === 403) { endTrainerSession('انتهت صلاحية دخول المدرب. سجّل الدخول مجددًا؛ الأرشيف المحلي ما زال متاحًا.'); return false; }
      if (r.ok && r.j.ok === true && Array.isArray(r.j.users) && r.j.local !== true) { DATA = r.j; DATA.users = mergeLocal(DATA.users); lastRefresh = Date.now(); refreshError = ''; }
      else { refreshError = 'تعذّر تحديث الخادم؛ البيانات المعروضة قديمة. آخر تحديث ناجح: ' + (lastRefresh ? new Date(lastRefresh).toLocaleString('ar-SA') : 'غير متوفر'); }
      render(); return !refreshError;
    } finally { clearTimeout(timeout); if (refreshing === request) refreshing = null; }
  }
  function endTrainerSession(message = '') { sessionEpoch++; clearInterval(pollTimer); pollTimer = null; refreshing = null; DATA = null; sessionStorage.removeItem('tf_trainer_pin'); PIN = ''; $('#drawer').innerHTML = ''; $('#drawer').classList.remove('on'); $('#logout').hidden = true; login(); if ($('#msg')) $('#msg').textContent = message; }
  function start() {
    $('#logout').hidden = false;
    $('#logout').onclick = () => endTrainerSession();
    clearInterval(pollTimer); pollTimer = setInterval(() => { if (!document.hidden && document.visibilityState === 'visible') return refresh(); }, 15000);
  }
  document.addEventListener('visibilitychange', () => { if (DATA && !document.hidden && document.visibilityState === 'visible') refresh(); });
  window.addEventListener('storage', event => { if (DATA && event.key === ARCHIVE_KEY) render(); });

  (async () => { if (PIN) { const r = await api(); if (r.ok && r.j.ok === true && Array.isArray(r.j.users) && r.j.local !== true) { DATA = r.j; lastRefresh = Date.now(); refreshError = ''; DATA.users = mergeLocal(DATA.users || []); render(); start(); } else login(); } else login(); })();
})();
</script>
