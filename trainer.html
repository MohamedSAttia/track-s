<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>لوحة المدرب — Track Ford GRC</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&family=Montserrat:wght@600;800&display=swap">
<style>
:root{--navy:#0A1B3D;--navy2:#13295A;--gold:#C9973B;--gold2:#E2B85A;--bg:#FBF8F2;--line:#E7DCC6;--fg:#1B2436;--muted:#5B6476;--good:#047857;--warn:#B45309;--bad:#B91C1C}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:Rubik,Tahoma,system-ui,sans-serif;font-size:14.5px;line-height:1.6}
header{background:var(--navy);color:#fff;border-bottom:3px solid var(--gold)}header .in{max-width:1360px;margin:0 auto;padding:14px 18px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
header h1{margin:0;font-size:20px}header .k{font-family:Montserrat,Arial;font-size:11px;letter-spacing:.14em;color:var(--gold2)}header .sp{margin-inline-start:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
header a{color:#D9C9A4;text-decoration:none;font-size:13px;border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:4px 12px}
main{max-width:1360px;margin:0 auto;padding:18px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.kpi{background:var(--navy);color:#fff;border-radius:14px;padding:14px;text-align:center}.kpi b{display:block;font-size:30px;font-family:Montserrat,Arial;color:var(--gold2)}.kpi span{font-size:12px;color:#D9C9A4}.kpi.l{background:#fff;color:var(--fg);border:1px solid var(--line)}.kpi.l b{color:var(--navy)}
.btn{border:1px solid var(--gold);background:var(--navy);color:#fff;border-radius:999px;padding:8px 16px;font:inherit;font-weight:700;cursor:pointer}.btn.gold{background:linear-gradient(180deg,#F2D584,#D4A84C);color:var(--navy)}.btn.ghost{background:#fff;color:var(--fg);border-color:var(--line)}.btn.sm{padding:4px 10px;font-size:12px}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fff}
table{width:100%;border-collapse:collapse;font-size:13px}th{background:var(--navy);color:#fff;padding:8px;text-align:right;position:sticky;top:0}td{border-bottom:1px solid var(--line);padding:7px 8px;vertical-align:middle}tr:hover td{background:#FBF8F2}
.bar{height:10px;background:#F3EBDA;border-radius:5px;overflow:hidden;min-width:70px}.bar i{display:block;height:100%;background:var(--good)}.bar.w i{background:var(--warn)}.bar.b i{background:var(--bad)}
.days{display:flex;gap:4px}.days span{width:30px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;background:#CBD5E1}.days span.g{background:var(--good)}.days span.w{background:var(--warn)}.days span.b{background:var(--bad)}.days span.z{background:#CBD5E1;color:#334155}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.grp{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.g{border:1px solid var(--line);border-radius:12px;padding:12px}.g h4{margin:0 0 6px;color:var(--navy)}
.login{max-width:420px;margin:60px auto;text-align:center}.login input{width:100%;text-align:center;font-size:22px;letter-spacing:.3em}
.drawer{position:fixed;inset:0 0 0 auto;width:min(560px,100%);background:#fff;box-shadow:-20px 0 60px rgba(0,0,0,.25);z-index:50;overflow:auto;padding:18px;transform:translateX(-100%);transition:.25s}html[dir=rtl] .drawer{inset:0 auto 0 0}.drawer.on{transform:none}
.chk{list-style:none;padding:0;margin:0;display:grid;gap:4px}.chk li{padding:6px 10px;border-radius:8px;background:#FBF8F2;font-size:13px}.chk li.ok{background:#ECFDF5}
.note{color:var(--muted);font-size:13px}.warnbox{background:#FEF3C7;border:1px solid #FCD34D;border-radius:12px;padding:12px 14px}
.chart{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;align-items:end;height:170px;padding:10px 4px 0}.chart div{background:linear-gradient(180deg,var(--gold2),var(--gold));border-radius:8px 8px 0 0;position:relative;min-height:4px}.chart div b{position:absolute;top:-22px;inset-inline:0;text-align:center;font-family:Montserrat,Arial;font-size:13px}.chart div span{position:absolute;bottom:-22px;inset-inline:0;text-align:center;font-size:11px;color:var(--muted)}
.owner-form{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.owner-form label{display:grid;gap:4px;flex:1 1 160px}.owner-form input,.owner-form select,.owner-form textarea{width:100%;min-width:0}.owner-form textarea{min-height:76px;resize:vertical}.owner-form .wide{flex-basis:100%}.presence{display:inline-block;width:9px;height:9px;border-radius:50%;background:#CBD5E1;margin-inline-end:5px}.presence.recent{background:#16a34a;box-shadow:0 0 0 3px rgba(22,163,74,.12)}
@media(max-width:600px){#cGroups{min-width:0!important;width:100%}.tools label{max-width:100%}}
@media print{header .sp,.tools,.btn{display:none}}
</style>
</head>
<body>
<header><div class="in"><div><div class="k">TRACK FORD · TRAINER CONSOLE</div><h1>لوحة المدرب — متابعة المتدربين والمجموعات</h1></div>
<div class="sp"><a href="index.html">البوابة</a><a href="academy.html?all=1">الأكاديمية (كل الأيام)</a><a href="system.html">النظام</a><a href="navigator.html">المقيّم</a><button class="btn ghost sm" id="logout" hidden>خروج</button></div></div></header>
<main id="main"></main>
<div class="drawer" id="drawer"></div>
<script src="tf-config.js"></script>
<script src="tf-course.js"></script>
<script>
(() => {
  const $ = s => document.querySelector(s); const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const DAYS = window.TFC ? window.TFC.DAYS : [];
  let DATA = null, FILTER = { g: '', q: '' }, timer = null, poll = null, PIN = '', epoch = 0, refreshing = false;
  let lastRefresh = 0, refreshError = '', lastCursor = null;
  let configDraft = null, configSaving = false, configMessage = '';
  let dataRevision = 0, drawerVersion = 0, drawerUserId = '';
  let broadcast = { to: 'all', title: '', body: '', sending: false, message: '' };
  let rename = { from: '', to: '', saving: false, message: '' };
  const pendingEdits = new Set(), pendingNotices = new Set();
  function captureOwnerDrafts() {
    if ($('#nTo')) { broadcast.to = $('#nTo').value; broadcast.title = $('#bTitle').value; broadcast.body = $('#bBody').value; }
    if ($('#rgFrom')) { rename.from = $('#rgFrom').value; rename.to = $('#rgTo').value; }
  }
  function allGroups() { return [...new Set([...(Array.isArray((DATA.config || {}).groups) ? DATA.config.groups : []), ...DATA.users.map(u => u.group || 'عام'), 'عام'])].filter(g => typeof g === 'string' && g).sort(); }
  function groupOptions(selected) { const groups = allGroups(); if (selected && !groups.includes(selected)) groups.push(selected); return groups.map(g => `<option value="${esc(g)}" ${g === selected ? 'selected' : ''}>${esc(g)}</option>`).join(''); }
  function rememberNote(note) { if (note) DATA.notifs = [note, ...(DATA.notifs || []).filter(n => n.id !== note.id)].slice(0, 50); }
  function closeDrawer() { drawerVersion++; drawerUserId = ''; $('#drawer').classList.remove('on'); $('#drawer').innerHTML = ''; }
  function captureConfigDraft() {
    const start = $('#cStart'), groups = $('#cGroups');
    if (start && groups && (start.value !== start.defaultValue || groups.value !== groups.defaultValue)) configDraft = { start: start.value, groups: groups.value };
  }
  try { PIN = sessionStorage.getItem('tf_trainer_pin') || ''; } catch (e) {}
  const num = v => Number.isFinite(Number(v)) ? Math.max(0, Number(v)) : 0;
  const percentage = v => Math.min(100, num(v));
  const csvCell = value => { let text = String(value == null ? '' : value); if (/^[\s]*[=+@-]|^[\t\r\n]/.test(text)) text = "'" + text; return '"' + text.replace(/"/g, '""') + '"'; };
  function safeUser(u) {
    const p = u.progress || {}, scores = p.scores || {};
    return { ...u, progress: { ...p, overall: percentage(p.overall), points: num(p.points), timeSec: num(p.timeSec),
      days: Object.fromEntries([1, 2, 3, 4, 5].map(k => [k, percentage((p.days || {})[k])])),
      scores: { ...scores, examBest: percentage(scores.examBest), examAttempts: num(scores.examAttempts), maturity: Math.min(5, num(scores.maturity)), quiz: percentage(scores.quiz) },
      builders: Array.isArray(p.builders) ? p.builders.filter(x => typeof x === 'string') : [] } };
  }
  const api = async (opt = {}, cursor = null) => {
    try {
      const r = await fetch((window.TF_API_BASE || '') + '/api/trainer' + (cursor ? '?cursor=' + encodeURIComponent(cursor) : ''), { cache: 'no-store', ...opt, headers: { 'content-type': 'application/json', 'x-trainer-pin': PIN } });
      const j = await r.json().catch(() => ({})); return { ok: r.ok && j.ok === true, status: r.status, j };
    } catch (e) { return { ok: false, status: 0, j: {} }; }
  };
  function errorText(r) {
    if (r.j.error === 'trainer_not_configured') return 'دخول المدرب غير مهيّأ على الخادم. يلزم ضبط كلمة مرور المدرب في إعدادات النشر.';
    if (['storage_not_configured', 'storage_unavailable'].includes(r.j.error)) return 'قاعدة بيانات المتدربين غير متاحة على الخادم. لم يتم تحميل سجل حي.';
    if (r.status === 401) return 'انتهت الجلسة أو بيانات الدخول غير صحيحة.';
    if (r.status === 403) return 'لا تسمح الجلسة الحالية بالوصول. سجّل الدخول مجددًا.';
    if (r.status === 400) return 'تحقق من البيانات المدخلة وطول النص ثم أعد المحاولة.';
    if (r.status === 404) return 'لم يعد المتدرب أو المستلِم موجودًا. حدّث القائمة ثم أعد المحاولة.';
    if (r.status === 409) return 'تغيّرت البيانات أثناء الحفظ. حدّث القائمة ثم أعد المحاولة.';
    if (r.status === 429) return 'محاولات كثيرة. انتظر قليلًا ثم أعد المحاولة.';
    return 'تعذّر الاتصال بالخادم. أعد المحاولة؛ الدخول المحلي لا يتيح متابعة المتدربين.';
  }
  function clearPrivate(message) {
    epoch++; clearInterval(poll); poll = null; clearTimeout(timer); DATA = null; PIN = ''; try { sessionStorage.removeItem('tf_trainer_pin'); } catch (e) {} lastCursor = null; lastRefresh = 0;
    configDraft = null; configSaving = false; configMessage = '';
    broadcast = { to: 'all', title: '', body: '', sending: false, message: '' }; rename = { from: '', to: '', saving: false, message: '' };
    pendingEdits.clear(); pendingNotices.clear(); closeDrawer();
    FILTER = { g: '', q: '' }; $('#drawer').classList.remove('on'); $('#drawer').innerHTML = ''; $('#logout').hidden = true;
    login(message);
  }
  function login(message = '') {
    $('#main').innerHTML = `<div class="card login"><div style="font-size:44px">🔐</div><h2>دخول المدرب</h2><p class="note">أدخل كلمة مرور المدرب للاتصال بسجل المتدربين.</p><input id="pin" type="password" autocomplete="current-password" placeholder="كلمة المرور"><div style="margin-top:12px"><button class="btn gold" id="go">دخول</button></div><div class="note" id="msg" style="margin-top:8px">${esc(message)}</div></div>`;
    $('#go').onclick = async () => {
      const pin = $('#pin').value; if (!pin) { $('#msg').textContent = 'أدخل رمز المدرب.'; return; }
      PIN = pin; $('#msg').textContent = 'جارٍ التحقق…'; $('#go').disabled = true;
      if (await refresh()) { try { sessionStorage.setItem('tf_trainer_pin', PIN); } catch (e) {} start(); }
      else if ($('#go')) { $('#go').disabled = false; $('#pin').value = ''; }
    };
    $('#pin').onkeydown = e => { if (e.key === 'Enter' && !$('#go').disabled) $('#go').click(); };
  }
  const pct = u => percentage(u.progress && u.progress.overall), cls = p => p >= 70 ? 'g' : p >= 35 ? 'w' : p > 0 ? 'b' : 'z';
  const pts = u => num(u.progress && u.progress.points);
  const tsec = u => num(u.progress && u.progress.timeSec);
  const fmtTime = s => { s = Math.round(s || 0); if (s < 60) return s + ' ث'; const m = Math.round(s / 60); if (m < 60) return m + ' د'; const h = Math.floor(m / 60); return h + ' س ' + (m % 60) + ' د'; };
  const sumBy = (arr, f) => arr.reduce((a, u) => a + (+f(u) || 0), 0);
  const timestamp = value => { const n = typeof value === 'number' ? value : (typeof value === 'string' && /^\d+$/.test(value) ? Number(value) : Date.parse(value)); return Number.isFinite(n) && n > 0 ? n : 0; };
  const recentActivity = u => Math.max(timestamp(u.lastSeen), timestamp((u.progress || {}).at));
  const seen = u => { const time = Math.max(recentActivity(u), timestamp(u.lastLogin)); return time ? new Date(time) : null; };
  const online = u => { const time = recentActivity(u), age = Date.now() - time; return u.status !== 'suspended' && time > 0 && age >= 0 && age < 150000; };
  const dot = u => `<span class="presence${online(u) ? ' recent' : ''}" title="${online(u) ? 'نشاط حديث خلال نحو دقيقتين ونصف' : 'لا يوجد نشاط حديث'}" aria-label="${online(u) ? 'نشاط حديث تقريبي' : 'لا يوجد نشاط حديث'}"></span>`;
  const ago = d => { if (!d) return '—'; const m = Math.round((Date.now() - d) / 60000); return m < 2 ? 'الآن' : m < 60 ? `قبل ${m} د` : m < 1440 ? `قبل ${Math.round(m / 60)} س` : d.toLocaleDateString('ar-SA'); };
  function render() {
    if (!DATA) return;
    captureConfigDraft(); captureOwnerDrafts();
    const focused = document.activeElement;
    const editing = focused && ['cStart', 'cGroups', 'fq', 'fg', 'nTo', 'bTitle', 'bBody', 'rgFrom', 'rgTo'].includes(focused.id) ? { id: focused.id, start: focused.selectionStart, end: focused.selectionEnd, direction: focused.selectionDirection } : null;
    const users = (DATA.users || []).slice().sort((a, b) => pct(b) - pct(a)); const cfg = DATA.config || {}; const t = window.TFC ? window.TFC.today() : 0; const sched = !!(cfg.start || '').trim();
    const groups = [...new Set(users.map(u => u.group || 'عام'))].sort(); const availableGroups = allGroups();
    const f = users.filter(u => (!FILTER.g || (u.group || 'عام') === FILTER.g) && (!FILTER.q || (u.name + ' ' + (u.org || '') + ' ' + (u.phone || '')).includes(FILTER.q)));
    const avg = a => a.length ? Math.round(a.reduce((x, y) => x + y, 0) / a.length) : 0;
    const active = users.filter(online).length;
    const dayAvg = n => avg(users.map(u => +(((u.progress || {}).days || {})[n] || 0)));
    $('#main').innerHTML = `
      <div class="card note" id="liveStatus" role="status">${esc(refreshError || ('آخر تحديث من الخادم: ' + (lastRefresh ? new Date(lastRefresh).toLocaleTimeString('ar-SA') : 'جارٍ التحميل') + ' · تحديث تلقائي كل 15 ثانية'))}${lastCursor ? ' · السجل المعروض جزئي؛ اضغط تحميل المزيد.' : ''}</div>
      <div class="kpis"><div class="kpi"><b>${users.length}</b><span>متدرب مسجّل</span></div><div class="kpi"><b>${active}</b><span>نشاط حديث (تقريبي، خلال 150 ثانية)</span></div><div class="kpi"><b>${avg(users.map(pct))}%</b><span>متوسط التقدّم</span></div><div class="kpi"><b>🏆 ${sumBy(users, pts)}</b><span>إجمالي النقاط</span></div><div class="kpi"><b>⏱ ${fmtTime(sumBy(users, tsec))}</b><span>إجمالي وقت التعلّم</span></div><div class="kpi l"><b>${!sched ? 'مفتوح' : (t === 0 ? 'قبل' : t === 6 ? 'انتهت' : t)}</b><span>${!sched ? 'النظام مفتوح لأي تاريخ — حدّد تاريخ بدء لتفعيل الجدول اليومي' : 'يوم الدورة الحالي · تبدأ ' + esc(cfg.start)}</span></div></div>
      <div class="card"><div class="tools"><b>متوسط التقدّم حسب اليوم</b><span class="note">يُحتسب من بنود كل يوم (محاضرات، أنشطة، ألعاب، أسئلة، ساحة الذكاء، النظام، المقيّم)</span></div><div class="chart">${DAYS.map(d => `<div style="height:${Math.max(3, dayAvg(d.n))}%"><b>${dayAvg(d.n)}%</b><span>اليوم ${d.n}</span></div>`).join('')}</div><div style="height:26px"></div></div>
      <div class="card"><div class="tools"><b>المجموعات</b><span class="note">النقاط والوقت مجمّعة لكل مجموعة — مرتّبة حسب النقاط</span></div><div class="grp">${groups.slice().sort((a, b) => sumBy(users.filter(u => (u.group || 'عام') === b), pts) - sumBy(users.filter(u => (u.group || 'عام') === a), pts)).map(g => { const gu = users.filter(u => (u.group || 'عام') === g); const gp = sumBy(gu, pts); return `<div class="g"><h4>${esc(g)} <small class="note">(${gu.length})</small></h4><div class="bar ${cls(avg(gu.map(pct)))}"><i style="width:${avg(gu.map(pct))}%"></i></div><div class="note">متوسط التقدّم ${avg(gu.map(pct))}% · 🏆 <b>${gp}</b> نقطة · ⏱ ${fmtTime(sumBy(gu, tsec))}<br>أفضل متدرب: ${esc((gu.slice().sort((a, b) => pts(b) - pts(a))[0] || {}).name || '—')} · نقاط التحدي: ${gu.reduce((a, u) => a + (+((((u.progress || {}).scores || {}).team || {})[g]) || 0), 0)}</div></div>`; }).join('') || '<span class="note">لا توجد مجموعات بعد.</span>'}</div></div>
      <div class="card"><div class="tools"><b>المتدربون (${f.length})</b><select id="fg"><option value="">كل المجموعات</option>${groups.map(g => `<option ${FILTER.g === g ? 'selected' : ''}>${esc(g)}</option>`).join('')}</select><input id="fq" placeholder="بحث بالاسم أو الجهة أو الجوال" value="${esc(FILTER.q)}"><span style="flex:1"></span><button class="btn ghost sm" id="csv">⬇ CSV</button><button class="btn ghost sm" id="print">🖨 طباعة</button><button class="btn sm" id="refresh">↻ تحديث</button>${lastCursor ? '<button class="btn ghost sm" id="more">تحميل المزيد</button>' : ''}</div>
        <div style="overflow:auto;max-height:70vh"><table><thead><tr><th>#</th><th>الاسم</th><th>المجموعة</th><th>الجهة</th><th>🏆 النقاط</th><th>⏱ الوقت</th><th>التقدّم</th><th>الأيام 1–5</th><th>أفضل اختبار</th><th>النضج</th><th>آخر نشاط</th><th></th></tr></thead><tbody>
        ${f.slice().sort((a, b) => pts(b) - pts(a)).map((u, i) => { const p = pct(u), d = (u.progress || {}).days || {}, sc = (u.progress || {}).scores || {}; return `<tr><td>${i + 1}</td><td>${dot(u)}<b>${esc(u.name)}</b>${u.status === 'suspended' ? ' <small>موقوف</small>' : ''}${u.role ? `<br><small class="note">${esc(u.role)}</small>` : ''}</td><td>${esc(u.group || 'عام')}</td><td>${esc(u.org || (u.progress || {}).org || '')}</td><td><b style="color:var(--gold);font-size:15px">${pts(u)}</b></td><td>${fmtTime(tsec(u))}</td><td><div class="bar ${cls(p)}"><i style="width:${p}%"></i></div><small>${p}%</small></td><td><div class="days">${[1, 2, 3, 4, 5].map(n => `<span class="${cls(+d[n] || 0)}" title="اليوم ${n}: ${+d[n] || 0}%">${+d[n] || 0}</span>`).join('')}</div></td><td>${sc.examBest ? sc.examBest + '%' : '—'}<br><small class="note">${sc.examAttempts || 0} محاولة</small></td><td>${sc.maturity ? sc.maturity + '/5' : '—'}</td><td>${ago(seen(u))}</td><td><button class="btn ghost sm" data-u="${esc(u.id)}">تفاصيل</button></td></tr>`; }).join('') || '<tr><td colspan="12" class="note">لم يسجّل أحد بعد — شارك رابط المنصّة مع المتدربين.</td></tr>'}
        </tbody></table></div></div>
      <div class="card"><div class="tools"><b>🔔 إرسال إشعار</b><span class="note">يظهر داخل المنصّة للمتدربين النشطين خلال نحو 20 ثانية.</span></div>
        <div class="owner-form"><label>المستلِم<select id="nTo"><option value="all" ${broadcast.to === 'all' ? 'selected' : ''}>كل المتدربين</option>${broadcast.to.startsWith('group:') && !availableGroups.includes(broadcast.to.slice(6)) ? `<option value="${esc(broadcast.to)}" selected>مجموعة غير موجودة: ${esc(broadcast.to.slice(6))}</option>` : ''}${availableGroups.map(g => `<option value="group:${esc(g)}" ${broadcast.to === 'group:' + g ? 'selected' : ''}>مجموعة: ${esc(g)}</option>`).join('')}</select></label><label>عنوان الإشعار<input id="bTitle" maxlength="120" value="${esc(broadcast.title)}"></label><label class="wide">نص الإشعار<textarea id="bBody" maxlength="600">${esc(broadcast.body)}</textarea></label><button class="btn gold sm" id="bSend">إرسال</button><span class="note" id="bMsg" role="status">${esc(broadcast.message)}</span></div>

  function drawer(u) {

  async function refresh(more = false) {
    if (!PIN || (refreshing && refreshing.epoch === epoch)) return false; const request = { epoch }; refreshing = request; const requestEpoch = epoch, revision = dataRevision;
    let cursor = more ? lastCursor : null, users = more && DATA ? DATA.users.slice() : [], response = null;

        const r = await api({}, cursor);
